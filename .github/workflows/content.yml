name: Content engine

# Drafts new posts from your sources, publishes the ones that pass every check
# (if CONTENT_AUTO_PUBLISH is on), and tops up your reading queue.
#
# Does nothing until secrets are added: Settings -> Secrets and variables -> Actions.
#   Secrets:   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, MISTRAL_API_KEY, OPENROUTER_API_KEY
#   Optional:  CONTENT_SOURCES_JSON (secret, to keep your feed list private)
#   Variables: CONTENT_AUTO_PUBLISH, CONTENT_MISTRAL_MODEL, CONTENT_OPENROUTER_MODEL, CONTENT_DRAFT_LIMIT
#
# This repository is public, so its logs are too. The runner prints only counts
# and status codes, never source text, drafts or keys.

on:
  schedule:
    - cron: "17 */3 * * *" # every three hours, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: content-engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Waiting out a provider's retry-after adds time; a run of eight posts fits comfortably.
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CONTENT_SOURCES_JSON: ${{ secrets.CONTENT_SOURCES_JSON }}
      CONTENT_PROVIDERS: ${{ vars.CONTENT_PROVIDERS || 'mistral,openrouter' }}
      CONTENT_MISTRAL_MODEL: ${{ vars.CONTENT_MISTRAL_MODEL || 'ministral-14b-latest,ministral-8b-latest,mistral-medium-latest' }}
      # Free OpenRouter models change often; run `npm run content -- models` and update this variable when one retires.
      CONTENT_OPENROUTER_MODEL: ${{ vars.CONTENT_OPENROUTER_MODEL || 'qwen/qwen3.8-27b:free,nex-agi/nex-n2.5-pro:free' }}
      CONTENT_OPENROUTER_DAILY_CALLS: "50"
      CONTENT_AUTO_PUBLISH: ${{ vars.CONTENT_AUTO_PUBLISH || 'false' }}
      CONTENT_DRAFT_LIMIT: ${{ vars.CONTENT_DRAFT_LIMIT || '8' }}
      CONTENT_QUEUE_TARGET: ${{ vars.CONTENT_QUEUE_TARGET || '24' }}
      CONTENT_DAILY_USD: "0"
    steps:
      - name: Check configuration
        id: ready
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::notice::Content engine secrets are not configured; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install
        if: steps.ready.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund
      - name: Run one cycle
        if: steps.ready.outputs.ok == 'true'
        run: npm run content -- cycle
